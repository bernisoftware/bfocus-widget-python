# Publica no PyPI ao receber a tag vX.Y.Z no espelho (BRIEF §7):
# 1) testes na menor e na maior versão suportadas (3.9 e 3.13: núcleo + Tk; Qt offscreen na 3.13);
# 2) tag == versão do pacote; 3) build + publish via OIDC (sem token guardado).
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python }}, núcleo + Tk)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4   # servidor simulado do kit de conformidade
        with:
          node-version: "20"
      - name: Tk e display virtual
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - name: Instala
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Testes (núcleo, integração e Tk)
        run: xvfb-run -a python -m pytest -q --ignore=tests/test_qt_host.py

  test-qt:
    name: pytest (Qt offscreen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Bibliotecas do QtWebEngine
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libnss3 libxcomposite1 libxdamage1 \
            libxrandr2 libgbm1 libxtst6 libxshmfence1 libfontconfig1 libdbus-1-3 libasound2t64
      - name: Instala
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test,qt]"
      - name: Testes do host Qt
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
        run: python -m pytest -q tests/test_qt_host.py

  publish:
    name: build + PyPI
    needs: [test, test-qt]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC do PyPI (trusted publisher)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag igual à versão do pacote
        run: |
          VERSION=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/bfocus_widget/_version.py').read_text()).group(1))")
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG versão=$VERSION"
          test "$TAG" = "$VERSION"
      - name: Build
        run: python -m pip install --upgrade build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
